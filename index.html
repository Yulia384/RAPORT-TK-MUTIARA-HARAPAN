<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>e-Raport TK Mutiara Harapan (NPSN: 70047565)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style id="dynamic-page-style">
@page { size: A4; margin: 12mm; }
</style>
<style>
:root {
  color-scheme: light;
  box-sizing: border-box;
  --bg: #eaf0ef;
  --panel: #ffffff;
  --fg: #1b2b2a;
  --muted: #5a6c6a;
  --line: #d2ddda;
  --accent: #17766a;
  --accent-fg: #ffffff;
  --accent-soft: #dcefea;
  --danger: #b3382c;
  --paper: #ffffff;
  --ink: #000000;
  --ink-muted: #222222;

  --p-warm: #e9a825;

}

body.paper-f4 {
  --page-w: 215mm;
  --page-min-h: 330mm;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--f-body);
  padding: 12px;
}

/* Modal PIN Login & Ganti PIN */
.pin-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 36, 34, 0.86);
  backdrop-filter: blur(6px);

  justify-content: center;
  padding: 16px;
}
.pin-overlay.hidden { display: none; }
.pin-card {
  background: #fff;
  border-radius: 16px;
  max-width: 400px;
  width: 100%;
  padding: 28px 24px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  border: 2px solid var(--accent);
}
.pin-card h2 {
  margin: 8px 0 4px;
  font: 700 1.4rem var(--f-display);
  color: var(--accent);
}
.pin-card p { margin: 0 0 16px; font-size: 0.86rem; color: var(--muted); }
.pin-input {

.role-badge {

  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
}
.role-badge.kepsek { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }

/* Floating Rich Text & Bold Toolbar */
.rich-bar {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 900;
  background: #1b2b2a;
  color: #fff;
  padding: 8px 12px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);

  flex-wrap: wrap;
  align-items: center;
  gap: 6px;

}
.rich-bar button {
  background: #2e4644;
  color: #fff;
  border: 1px solid #486966;
  border-radius: 6px;
  padding: 5px 10px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.rich-bar button:hover { background: var(--accent); border-color: var(--accent); }
.rich-bar button.active { background: var(--p-warm); color: #000; border-color: var(--p-warm); }
.rich-bar span.sep { width: 1px; height: 20px; background: #486966; margin: 0 2px; }

.app {
  display: grid;
  grid-template-columns: minmax(280px, 325px) minmax(0, 1fr);
  gap: 16px;
  max-width: 1340px;
  margin: 0 auto;
  align-items: start;
}

@media (max-width: 960px) {
  body { padding: 8px; }
  .app { grid-template-columns: 1fr; gap: 12px; }
}

main { min-width: 0; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  position: sticky;
  top: 12px;
  max-height: calc(100vh - 24px);
  overflow: auto;
}

@media (max-width: 960px) {
  .panel { position: static; max-height: none; }
}

.brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand-left { display: flex; align-items: center; gap: 10px; }
.brand svg, .brand img { width: 38px; height: 38px; flex: none; object-fit: contain; border-radius: 6px; }
.brand b { font: 700 1.12rem/1.1 var(--f-display); display: block; }
.brand span { font-size: 0.74rem; color: var(--muted); }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 8px; }
.tab { font: inherit; font-weight: 700; font-size: 0.78rem; border: 0; background: transparent; color: var(--muted); padding: 8px 3px; border-radius: 6px; cursor: pointer; min-height: 38px; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.class-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--line); }
.clsb { font: inherit; font-weight: 700; font-size: 0.78rem; border: 0; background: transparent; color: var(--muted); padding: 7px 6px; border-radius: 6px; cursor: pointer; text-align: center; }
.clsb[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

.hint { margin: 0; font-size: 0.81rem; color: var(--muted); }
.ph { margin: 6px 0 0; font: 700 0.94rem var(--f-display); }
.pbody { display: flex; flex-direction: column; gap: 9px; }
.slist, .seclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sbtn { width: 100%; text-align: left; font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; min-height: 42px; }
.sbtn[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.sbtn .sn { font-weight: 700; word-break: break-word; }
.sbtn .ss { font-size: 0.76rem; color: var(--muted); }

.btn { font: inherit; font-weight: 700; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; min-height: 36px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.8rem; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: #e6b8b3; }
.btn.danger:hover { background: #fdf2f1; }
.btn:disabled, .mini:disabled { opacity: 0.45; cursor: not-allowed; }

.srow { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.acts { display: flex; gap: 4px; flex: none; }
.mini { font: inherit; font-size: 0.78rem; font-weight: 700; min-width: 30px; min-height: 30px; padding: 0 7px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; cursor: pointer; }
.mini.danger { color: var(--danger); }
.box { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 8px; resize: vertical; }
.fld { font: inherit; font-size: 0.85rem; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); padding: 7px; min-height: 36px; }

.scgrid { display: grid; grid-template-columns: 55px minmax(0,1fr) 55px; gap: 6px; align-items: center; }
.scgrid .h { font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.scgrid .full { grid-column: 1/-1; margin-bottom: 6px; }
.status { margin: 0; font-size: 0.76rem; color: var(--muted); }

.toolbar { max-width: 900px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.toolbar p { margin: 0; font-size: 0.82rem; color: var(--muted); flex: 1 1 180px; }
.tgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.colorpick, .paperpick { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; background: var(--bg); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); min-height: 36px; }
.colorpick input { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: #fff; cursor: pointer; }
.paperpick select { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--fg); cursor: pointer; outline: none; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.segb { font: inherit; font-weight: 700; font-size: 0.8rem; border: 0; background: transparent; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; min-height: 32px; }
.segb[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

.nilai { max-width: 900px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ntbl { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 600px; }
.ntbl th, .ntbl td { padding: 6px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.ntbl thead th { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.ntbl th[scope="row"] { text-align: left; font-weight: 700; }
.nin { width: 52px; height: 36px; text-align: center; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.cabbr { display: block; font-size: 0.7rem; font-weight: 700; color: var(--muted); }
.cnt { font-size: 0.8rem; color: var(--muted); }
.linkbtn { font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-align: left; }

/* Halaman Raport Dokumen — Ukuran Seragam Semua Lembar */
.sheets { display: flex; flex-direction: column; gap: 22px; max-width: 900px; margin: 0 auto; align-items: center; }
.page {
  position: relative;
  width: 100%;
  max-width: 820px;
  min-height: 1120px;
  background: var(--paper);
  color: #000;
  padding: clamp(20px, 4vw, 38px);
  border-radius: 12px;
  border: 1px solid #dce6e2;
  box-shadow: 0 4px 18px rgba(0,0,0,.06);
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
body.paper-f4 .page { min-height: 1245px; }

.page:not(.cover)::before { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: linear-gradient(180deg, var(--p-accent), #d8b56b); border-radius: 12px 0 0 12px; }

.runhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: 0.76rem; color: var(--ink-muted); border-bottom: 2px solid var(--p-accent); padding-bottom: 6px; }
.pgno { font-size: 0.74rem; color: var(--ink-muted); text-align: center; margin-top: auto; padding-top: 8px; border-top: 1px solid #e1e9e5; }
.h3 { font: 700 1.08rem var(--f-display); color: var(--p-accent); margin: 0; }
.sub { font-size: 0.84rem; color: var(--ink-muted); margin: 0; }

/* Rich Editable Element — Semua kata/kalimat bisa diedit & ditebalkan per bagian */
.ed {
  font: inherit;
  color: inherit;
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--rule);
  border-radius: 0;
  padding: 2px 3px;
  min-width: 24px;
  outline: none;
  display: inline-block;
  word-break: break-word;
}
.ed.block { display: block; width: 100%; }
.ed.box-area {
  display: block;
  width: 100%;
  border: 1px dashed var(--rule);
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 68px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.ed:focus { background: rgba(23,118,106,.07); border-bottom-color: var(--p-accent); }
.ed[data-placeholder]:empty::before {
  content: attr(data-placeholder);
  color: #8fa09d;
  font-weight: 400;
  pointer-events: none;
}

/* Sampul / Lembar Pertama Sama Besarnya */
.cover {
  text-align: center;
  justify-content: space-between;
  align-items: center;
  border: 2.5px solid var(--p-accent);
  gap: 10px;
}
.cover-top { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.logo-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 2px; }
.logo-preview { width: 98px; height: 98px; display: flex; align-items: center; justify-content: center; border-radius: 14px; overflow: hidden; }
.logo-preview svg, .logo-preview img { width: 100%; height: 100%; object-fit: contain; }
.cover .p-yayasan { font: 700 1.05rem/1.2 var(--f-display); color: var(--ink-muted); letter-spacing: 0.04em; text-transform: uppercase; text-align: center; width: 100%; }
.cover .p-name { font: 700 1.95rem/1.15 var(--f-display); color: var(--p-accent); letter-spacing: 0.03em; text-transform: uppercase; text-align: center; width: 100%; }
.cover .p-npsn-wrap { display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-weight: 700; font-size: 0.9rem; color: var(--p-accent); background: #f2f8f6; padding: 3px 14px; border-radius: 999px; border: 1px solid #cce0da; }
.cover .tag, .cover .addr { font-size: 0.86rem; color: var(--ink-muted); text-align: center; max-width: 640px; width: 100%; }
.cover .rule { width: 120px; height: 4px; background: var(--p-warm); border-radius: 2px; margin: 4px auto; }
.cover .jd { font: 700 1.32rem var(--f-display); text-align: center; color: var(--ink); letter-spacing: 0.02em; width: 100%; }
.semline { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; font-weight: 700; width: 100%; font-size: 0.95rem; }

/* Kotak Pas Foto Anak 3x4 / 4x6 di Sampul */
.cover-photo-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 4px 0; }
.student-photo-frame {
  width: 30mm;
  height: 40mm;
  border: 1.5px solid var(--p-accent);
  border-radius: 4px;
  background: #f8fbfa;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  color: var(--muted);
  font-size: 0.75rem;
  text-align: center;
  padding: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.student-photo-frame.size-4x6 { width: 40mm; height: 60mm; }
.student-photo-frame.has-img { border-style: solid; padding: 0; background: #fff; }
.student-photo-frame img { width: 100%; height: 100%; object-fit: cover; }
.media-actions { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.media-btn { font: inherit; font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); background: #fff; color: var(--fg); cursor: pointer; }
.media-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.media-btn.del { color: var(--danger); }

.coverbox { width: 100%; max-width: 510px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid var(--p-accent); border-radius: 12px; padding: 14px 18px; text-align: left; background: linear-gradient(145deg, #ffffff, #f4faf8); }
.coverbox .row { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 8px; align-items: center; font-size: 0.9rem; }
.coverbox .big { font: 700 1.18rem var(--f-display); color: var(--p-accent); }

/* Profil & Pertumbuhan */
.idgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; }
@media (max-width: 640px) { .idgrid { grid-template-columns: 1fr; } }
.idrow { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 6px; align-items: center; font-size: 0.88rem; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.box2, .note { border: 1px solid #dce6e2; border-radius: 8px; padding: 10px 12px; background: #fff; display: flex; flex-direction: column; gap: 6px; }
.mrow { display: grid; grid-template-columns: minmax(0,1fr) 72px 36px; gap: 6px; align-items: center; font-size: 0.88rem; }

/* Penilaian & Skala */
.rtbl { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.rtbl th, .rtbl td { border: 1px solid var(--rule); padding: 6px; text-align: left; vertical-align: middle; }
.rtbl th { background: #eef3f2; font-weight: 700; }
.rtbl .c { text-align: center; }
.ed.numin { width: 52px; text-align: center; font-weight: 700; color: var(--ink); }
.kt { font-size: 0.8rem; color: var(--ink-muted); }

.lvlwrap { position: relative; display: inline-block; width: 100%; }
.lvlwrap::after { content: "\25BE"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 0.7rem; }
.lvl { appearance: none; -webkit-appearance: none; font: 700 0.78rem var(--f-body); padding: 4px 18px 4px 8px; border-radius: 999px; border: 1px solid #cdd8d5; background: #f1f4f3; color: #55625f; cursor: pointer; width: 100%; }
.lvl[data-lv="l1"], .lvlpill[data-lv="l1"] { background: #dcf0ea; color: #0d5a4e; border-color: #9fd3c6; }
.lvl[data-lv="l2"], .lvlpill[data-lv="l2"] { background: #e3ecf8; color: #233f6b; border-color: #aac0e0; }
.lvl[data-lv="l3"], .lvlpill[data-lv="l3"] { background: #fdf0cf; color: #6b4a05; border-color: #ecd08a; }
.lvl[data-lv="l4"], .lvlpill[data-lv="l4"] { background: #fbe3df; color: #7a2418; border-color: #e8b3aa; }
.lvlpill { display: inline-block; font: 700 0.76rem var(--f-body); padding: 2px 8px; border-radius: 999px; border: 1px solid #cdd8d5; background: #f1f4f3; }

/* Narasi */
.blk { display: flex; flex-direction: column; gap: 7px; border: 1px solid #dce6e2; border-radius: 8px; padding: 10px 12px; background: #fcfefd; }
.sec-h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sec-title { flex: 1 1 200px; font: 700 1rem var(--f-display); color: var(--p-accent); border-bottom: 0; }
.narrative-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; background: #f1f7f4; border: 1px solid #dce9e3; border-radius: 6px; }
.narrative-tools select { flex: 1 1 180px; font: inherit; font-size: 0.8rem; padding: 6px; border: 1px solid #bdcec6; border-radius: 6px; background: #fff; min-height: 36px; }
.tplbtn { font: inherit; font-size: 0.78rem; font-weight: 700; color: var(--p-accent); background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; cursor: pointer; min-height: 36px; }

.snippet-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0; padding: 7px; background: #f2f7f5; border: 1px solid #d9e7e1; border-radius: 8px; }
.snippet-tools label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1 1 220px; font-size: 0.78rem; font-weight: 700; color: #263a35; }
.snippet-select { width: 100%; min-width: 140px; padding: 6px; border: 1px solid #b9cbc4; border-radius: 6px; background: #fff; font: inherit; font-size: 0.8rem; min-height: 36px; }

/* Pengesahan, Tanda Tangan (TTD) & Stempel Transparan Draggable */
.signwrap {
  position: relative;
  border: 1px solid #dce6e2;
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.place { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-end; font-size: 0.88rem; }
.sign { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; text-align: center; font-size: 0.88rem; position: relative; }
@media (max-width: 580px) { .sign { grid-template-columns: 1fr; gap: 22px; } }
.sign-col { position: relative; display: flex; flex-direction: column; align-items: center; }
.sign .lab { color: var(--ink-muted); font-weight: 600; width: 100%; text-align: center; }

  width: 100%;
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 4px 0;
}
.ttd-img {
  max-height: 100%;
  width: auto;
  object-fit: contain;
  mix-blend-mode: multiply;
  pointer-events: none;
  user-select: none;
  transition: transform 0.1s;
}
.ttd-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: center;
