function tplB(blk,lv,nama){
  var t=T[blk.id];
  var cap=(t&&t[lv])?t[lv]:GEN[lv].replace('%t',(blk.title||'ini').toLowerCase());
  var sar=t?t.saran:'';
  return (cap+(sar?' '+sar:'')).replace(/\{nama\}/g,nama);
}
function getS(s,id){return s.sc[id]||(s.sc[id]={num:'',level:''})}
function getB(s,id){return s.bn[id]||(s.bn[id]={text:'',auto:false})}
function blockLevel(s,blk,sc){
  var t=0,c=0;
  (blk.from||[]).forEach(function(id){var x=parseNum((s.sc[id]||{}).num);if(x!==null){t+=x;c++}});
  return c?levelFor(t/c,sc):'';
}
function regenB(s,blk,sc){
  var b=getB(s,blk.id);
  if(b.auto||!(b.text||'').trim()){b.text=tplB(blk,blockLevel(s,blk,sc)||'l2',callName(s));b.auto=true}
}
function regenBlocksFor(s,secId){D.blocks.forEach(function(blk){if((blk.from||[]).indexOf(secId)>-1)regenB(s,blk)})}
function setNum(s,secId,raw){
  var r=getS(s,secId);
  var x=parseNum(raw),norm=raw;
  if(x!==null&&parseFloat(String(raw).replace(',','.'))>100)norm='100';
  r.num=norm;
  if(x!==null){r.level=levelFor(x);regenBlocksFor(s,secId)}
  return norm;
}

}

function parseCSVLine(line,sep){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){
      if(inQ&&line[i+1]==='"'){cur+='"';i++}
      else inQ=!inQ;
    }else if(c===sep&&!inQ){res.push(cur);cur=''}
    else cur+=c;
  }
  res.push(cur);
  return res;
}

function handleExcelImport(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()});
  if(lines.length<2){alert('File CSV kosong atau format tidak sesuai.');return}
  var sep=lines[0].indexOf(';')>-1?';':',';
  var headers=parseCSVLine(lines[0],sep);
  var imported=[];
  for(var i=1;i<lines.length;i++){
    var cols=parseCSVLine(lines[i],sep);
    if(!cols[0]||!cols[0].trim())continue;
    var s=newStudent({
      nama:cols[0]||'',panggilan:cols[1]||(cols[0]||'').split(' ')[0],
      nik:cols[2]||'',nisn:cols[3]||'',jk:cols[4]||'',ttl:cols[5]||'',
      agama:cols[6]||'',rombel:cols[7]||'Rombel B',ortu:cols[8]||'',
      tb:cols[9]||'',bb:cols[10]||'',lk:cols[11]||'',
      sakit:cols[12]||'0',izin:cols[13]||'0',alpa:cols[14]||'0'
    });
    D.sections.forEach(function(sec,idx){
      var valStr=cols[15+idx];
      if(valStr!==undefined&&valStr!==''){
        var num=parseNum(valStr);
        if(num!==null)s.sc[sec.id]={num:String(num),level:levelFor(num)};
      }
    });
    D.blocks.forEach(function(blk){regenB(s,blk)});
    imported.push(s);
  }
  if(imported.length){
    D.students=imported;
    D.cur=imported[0].id;
    renderAll();save();
    setStatus('Berhasil mengimpor '+imported.length+' data siswa dari Excel.');
  }
}

document.addEventListener('input',function(e){
  var t=e.target,ds=t.dataset||{};
  if(ds.p){
    setv(ds.p,t.value);syncPath(ds.p,t);
    if((ds.p==='s.nama'||ds.p==='s.rombel'||ds.p==='school.npsn')&&ui.tab==='siswa')renderPanel();
  }else if(ds.scale!=null){
    var k=sk(ds.scale);if(!k)return;
    if(ds.f==='min'){var v=parseFloat(String(t.value).replace(',','.'));k.min=isNaN(v)?0:v}else k[ds.f]=t.value;
    renderMain();save();return;
  }else if(ds.nsid){
    var st=D.students.find(function(x){return x.id===ds.nsid});if(!st)return;
    var norm=setNum(st,ds.sec,t.value);
    if(norm!==t.value)t.value=norm;
    var ab=t.nextElementSibling;if(ab)ab.textContent=abbrOf(getS(st,ds.sec).level);
    save();return;
  }else if(ds.blk){
    var blk=D.blocks.find(function(x){return x.id===ds.blk});if(!blk)return;
    if(ds.f==='title'){blk.title=t.value;if(ui.tab==='bidang')renderPanel()}
    else{var b=getB(cur(),blk.id);b.text=t.value;b.auto=false}
  }else if(ds.sec){
    var sec=D.sections.find(function(x){return x.id===ds.sec});if(!sec)return;
    var f=ds.f,s=cur();
    if(f==='title'||f==='cp'){sec[f]=t.value;if(f==='title'&&ui.tab==='bidang')renderPanel()}
    else if(f==='num'){
      var nm=setNum(s,sec.id,t.value);if(nm!==t.value)t.value=nm;
      refreshRow(sec.id);
    }else if(f==='level'){
      getS(s,sec.id).level=t.value;refreshRow(sec.id);
    }
  }else return;
  if(t.tagName==='TEXTAREA')grow(t);
  save();
});

function moveItem(list,id,dir){
  var idx=list.findIndex(function(x){return x.id===id});
  if(idx<0)return;
  var nidx=idx+dir;
  if(nidx<0||nidx>=list.length)return;
  var tmp=list[idx];list[idx]=list[nidx];list[nidx]=tmp;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id||'',lst=b.dataset.list||'';
  var s=cur();
  switch(act){
    case 'tab':ui.tab=b.dataset.tab;ui.confirm=null;renderPanel();break;
    case 'view':ui.view=b.dataset.view;renderMain();break;
    case 'pick':D.cur=id;ui.view='raport';ui.confirm=null;renderAll();save();break;
    case 'open':D.cur=id;ui.view='raport';ui.confirm=null;renderAll();save();window.scrollTo(0,0);break;
    case 'addStudent':
      var ns=newStudent({nama:'Siswa Baru'});
      D.blocks.forEach(function(bk){regenB(ns,bk)});
      D.students.push(ns);D.cur=ns.id;ui.view='raport';ui.confirm=null;renderAll();save();break;
    case 'delStudent':
      if(D.students.length>1){
        if(ui.confirm!=='delStudent:'){ui.confirm='delStudent:';renderPanel();break}
        D.students=D.students.filter(function(x){return x.id!==s.id});
        D.cur=D.students[0].id;ui.confirm=null;renderAll();save();
      }
      break;
    case 'up':
      moveItem(lst==='sec'?D.sections:D.blocks,id,-1);renderAll();save();break;
    case 'down':
      moveItem(lst==='sec'?D.sections:D.blocks,id,1);renderAll();save();break;
    case 'del':
      var arr=lst==='sec'?D.sections:D.blocks;
      if(arr.length>1){
        var key='del:'+lst+id;
        if(ui.confirm!==key){ui.confirm=key;renderPanel();break}
        if(lst==='sec')D.sections=D.sections.filter(function(x){return x.id!==id});
        else D.blocks=D.blocks.filter(function(x){return x.id!==id});
        ui.confirm=null;renderAll();save();
      }
      break;
    case 'addSec':
      D.sections.push({id:uid(),title:'Bidang Penilaian Baru',cp:'Capaian pembelajaran'});
      renderAll();save();break;
    case 'addBlk':
      D.blocks.push({id:uid(),title:'Blok Narasi Baru',from:[]});
      renderAll();save();break;
    case 'reapply':
      D.students.forEach(function(st){
        D.sections.forEach(function(sec){
          var num=parseNum((st.sc[sec.id]||{}).num);
          if(num!==null)st.sc[sec.id].level=levelFor(num);
        });
      });
      renderAll();save();setStatus('Skala nilai diterapkan ulang.');break;
    case 'uploadLogo':$('#logoInput').click();break;
    case 'delLogo':D.school.logo='';renderAll();save();break;
    case 'uploadPhoto':$('#photoInput').click();break;
    case 'delPhoto':s.foto='';renderPaper();save();break;
    case 'addSnippet':
      var target=b.dataset.target;
      var noteBox=b.parentElement.parentElement.querySelector('textarea[data-p="s.'+target+'"]');
      var snippetSelect=b.parentElement.querySelector('.snippet-select');
      var snippets=PAGE_SNIPPETS[target]||[];
      var chosen=snippetSelect&&snippetSelect.value!==''?snippets[Number(snippetSelect.value)]:'';
      if(chosen&&noteBox){
        var current=noteBox.value.trim();
        noteBox.value=current?(current+'\n\n'+chosen):chosen;
        noteBox.dispatchEvent(new Event('input',{bubbles:true}));
        grow(noteBox);save();
      }
      break;
    case 'addPraise':
      var praiseSel=b.parentElement.querySelector('.praise-select');
      var praise=praiseSentence(praiseSel&&praiseSel.value);
      if(praise){
        var praiseData=getB(s,id);var praiseText=praise.replace(/^Ananda/,callName(s));
        if(praiseData.text.indexOf(praiseText)<0){
          praiseData.text=(praiseData.text.trim()?praiseData.text.trim()+' ':'')+praiseText;
          praiseData.auto=false;refreshBlocks();save();
        }
      }
      break;
    case 'tpl':
      var blk=D.blocks.find(function(x){return x.id===id});if(!blk)return;
      var bb=getB(s,id);
      bb.text=tplB(blk,blockLevel(s,blk)||'l2',callName(s));bb.auto=true;
      refreshBlocks();save();break;
    case 'fillAll':
      D.blocks.forEach(function(blk2){var m=getB(s,blk2.id);if(!m.text||!m.text.trim()){m.auto=false;regenB(s,blk2)}});
      refreshBlocks();save();break;
    case 'pdf':window.print();break;
    case 'word':exportToWord();break;
    case 'exportExcel':exportToExcel();break;
    case 'importExcel':$('#excelImportInput').click();break;
    case 'copy':
      var exp=$('#exp');if(exp){exp.select();document.execCommand('copy');setStatus('Cadangan JSON disalin ke clipboard.')}
      break;
    case 'restore':
      try{
        var parsed=JSON.parse($('#imp').value);
        if(valid(parsed)){D=parsed;ui.confirm=null;renderAll();save();setStatus('Data berhasil dipulihkan.')}
        else alert('Format cadangan tidak valid.');
      }catch(err){alert('Gagal membaca teks cadangan JSON.')}
      break;
    case 'reset':
      if(ui.confirm!=='reset:'){ui.confirm='reset:';renderPanel();break}
      localStorage.removeItem(KEY);
      D=seed();ui.confirm=null;renderAll();save();setStatus('Data dikembalikan ke pengaturan awal.');
      break;
  }
});

function handleImageUpload(file,maxW,callback){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var scale=Math.min(1,maxW/img.width);
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('change',function(e){
  if(e.target.id==='themeColor'){
    D.school.accent=e.target.value;
    document.documentElement.style.setProperty('--p-accent',e.target.value);
    renderMain();save();
  }else if(e.target.id==='paperSizeSel'){
    D.school.paperSize=e.target.value;
    applyPaperSize();save();
  }else if(e.target.id==='logoInput'){
    handleImageUpload(e.target.files[0],300,function(dataUrl){
      D.school.logo=dataUrl;renderAll();save();
    });
    e.target.value='';
  }else if(e.target.id==='photoInput'){
    handleImageUpload(e.target.files[0],350,function(dataUrl){
      cur().foto=dataUrl;renderPaper();save();
    });
    e.target.value='';
  }else if(e.target.id==='excelImportInput'){
    var f=e.target.files[0];
    if(f){
      var r=new FileReader();
      r.onload=function(ev){handleExcelImport(ev.target.result)};
      r.readAsText(f);
    }
    e.target.value='';
  }
});

window.addEventListener('resize',growAll);
renderAll();
})();
</script>
